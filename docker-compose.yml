version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: imob-pro-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - imob_internal_network
    labels:
      - "traefik.enable=false"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        - NEXT_PUBLIC_CLERK_SIGN_IN_URL=${NEXT_PUBLIC_CLERK_SIGN_IN_URL}
        - NEXT_PUBLIC_CLERK_SIGN_UP_URL=${NEXT_PUBLIC_CLERK_SIGN_UP_URL}
    container_name: imob-pro-app
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - proxy_network
      - imob_internal_network

    environment:
      # Database
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - INTER_WEBHOOK_PROXY_SECRET=${INTER_WEBHOOK_PROXY_SECRET}
      - CRON_SECRET=${CRON_SECRET}
      - INTER_STATUS_SYNC_BATCH_SIZE=${INTER_STATUS_SYNC_BATCH_SIZE:-50}
      - INTER_STATUS_SYNC_INTERVAL_MS=${INTER_STATUS_SYNC_INTERVAL_MS:-6500}
      - INTER_BATCH_SIZE=${INTER_BATCH_SIZE:-50}
      - INTER_BATCH_INTERVAL_MS=${INTER_BATCH_INTERVAL_MS:-6500}
      # Authentication (Clerk)
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}

      # Storage (RustFS / S3) - Padrão 1 (lib/rust/client.ts)
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
      - RUSTFS_ENDPOINT_URL=${RUSTFS_ENDPOINT_URL}
      - RUSTFS_BUCKET=${RUSTFS_BUCKET}

      # Storage (RustFS / S3) - Padrão 2 (lib/storage.ts usado em vistorias)
      - RUSTFS_ENDPOINT=${RUSTFS_ENDPOINT:-${RUSTFS_ENDPOINT_URL}}
      - RUSTFS_ACCESS_KEY_ID=${RUSTFS_ACCESS_KEY_ID:-${RUSTFS_ACCESS_KEY}}
      - RUSTFS_SECRET_ACCESS_KEY=${RUSTFS_SECRET_ACCESS_KEY:-${RUSTFS_SECRET_KEY}}
      - RUSTFS_BUCKET_NAME=${RUSTFS_BUCKET_NAME:-${RUSTFS_BUCKET}}

      # Next.js configurations
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - RUSTFS_PUBLIC_URL=${RUSTFS_PUBLIC_URL}
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY}
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.imob-pro.loadbalancer.server.port=3000"

      - "traefik.http.routers.imob-pro.rule=Host(`imobpro.euatendo.online`)"
      - "traefik.http.routers.imob-pro.entrypoints=websecure"
      - "traefik.http.routers.imob-pro.tls=true"
      - "traefik.http.routers.imob-pro.tls.certresolver=lets-encrypt"
      - "traefik.docker.network=proxy_network"
      - "traefik.http.routers.imob-pro-inter-webhook.rule=Host(`inter-webhook.euatendo.online`) && Path(`/api/webhooks/inter`)"
      - "traefik.http.routers.imob-pro-inter-webhook.entrypoints=websecure"
      - "traefik.http.routers.imob-pro-inter-webhook.tls=true"
      - "traefik.http.routers.imob-pro-inter-webhook.tls.certresolver=lets-encrypt"
      - "traefik.http.routers.imob-pro-inter-webhook.tls.options=interWebhook@file"
      - "traefik.http.routers.imob-pro-inter-webhook.middlewares=interWebhookInternalAuth@file"
      - "traefik.http.routers.imob-pro-inter-webhook.service=imob-pro" # Site público
      - "traefik.http.routers.scatolin-site.rule=Host(`scatolinimoveis.com.br`) || Host(`www.scatolinimoveis.com.br`)"
      - "traefik.http.routers.scatolin-site.entrypoints=websecure"
      - "traefik.http.routers.scatolin-site.tls=true"
      - "traefik.http.routers.scatolin-site.tls.certresolver=lets-encrypt"
      - "traefik.http.routers.scatolin-site.service=imob-pro"

      - "traefik.docker.network=proxy_network"

  # Reconcilia cobranças pendentes às 08:00 e 13:00 de São Paulo
  # (11:00 e 16:00 UTC, fuso fixado no contêiner abaixo).
  inter-status-cron:
    image: alpine:3.20
    container_name: imob-pro-inter-status-cron
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    networks:
      - imob_internal_network
    environment:
      - CRON_SECRET=${CRON_SECRET}
      - TZ=UTC
    command:
      - /bin/sh
      - -c
      - |
        if [ -z "$$CRON_SECRET" ]; then
          echo "[inter-status-cron] CRON_SECRET não configurado" >&2
          exit 1
        fi
        printf '0 11,16 * * * wget -O- --header="Authorization: Bearer %s" --post-data="" http://app:3000/api/inter/cobrancas/sync 2>&1\n' "$$CRON_SECRET" > /etc/crontabs/root
        exec crond -f -l 2

  # Consome a fila persistente de emissão e sincronização do Banco Inter.
  inter-batch-worker:
    image: alpine:3.20
    container_name: imob-pro-inter-batch-worker
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    networks:
      - imob_internal_network
    environment:
      - CRON_SECRET=${CRON_SECRET}
    command:
      - /bin/sh
      - -c
      - |
        if [ -z "$$CRON_SECRET" ]; then
          echo "[inter-batch-worker] CRON_SECRET não configurado" >&2
          exit 1
        fi
        while true; do
          wget -q -T 120 -O /dev/null \
            --header="Authorization: Bearer $$CRON_SECRET" \
            --header="X-Worker-Id: imob-pro-inter-batch-worker" \
            --post-data="" \
            http://app:3000/api/internal/inter/tasks/process \
            || echo "[inter-batch-worker] tentativa de processamento falhou" >&2
          sleep 1
        done
    stop_grace_period: 130s

  # Serviço manual, desativado por padrão. Para rodar uma vez no Portainer,
  # habilite o profile `legacy-migration` e defina MIGRATE_LEGACY_CONFIRM=true.
  # Ele só lê tabelas legadas e cria Person/Lease/LeaseParty; não altera
  # vistorias ou contratos legados.
  legacy-migration:
    profiles: [ "legacy-migration" ]
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    command: [ "npm", "run", "migrate:legacy-leases" ]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - imob_internal_network
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - MIGRATE_LEGACY_CONFIRM=${MIGRATE_LEGACY_CONFIRM:-false}

  rustfs:
    image: rustfs/rustfs:latest
    container_name: imobpro-storages3
    restart: unless-stopped
    ports:
      - "9001:9001"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
      - ENABLE_CONSOLE=true
      - RUSTFS_CORS_ALLOWED_ORIGINS=*
    volumes:
      - rustfs_data:/data
    networks:
      - imob_internal_network
      - proxy_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.imobpro-storage.rule=Host(`imobprostorage.euatendo.online`)"
      - "traefik.http.routers.imobpro-storage.entrypoints=websecure"
      - "traefik.http.routers.imobpro-storage.tls=true"
      - "traefik.http.routers.imobpro-storage.tls.certresolver=lets-encrypt"
      - "traefik.http.services.imobpro-storage.loadbalancer.server.port=9001"
      - "traefik.docker.network=proxy_network"

volumes:
  postgres_data:
    name: imob-pro-postgres-data
  rustfs_data:
    name: imob-pro-rustfs-data

networks:
  imob_internal_network:
    driver: bridge
    name: imob-pro-internal-network
  proxy_network:
    external: true
